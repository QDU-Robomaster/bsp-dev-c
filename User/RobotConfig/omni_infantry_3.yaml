modules:
  - module: xrobot-org/BlinkLED
    id: blink_led
    args:
      - led: LED_B
      - blink_cycle: 250
  - module: xrobot-org/BuzzerAlarm
    id: buzzer_alarm
    args:
      - pwm: pwm_tim4_ch3
      - alarm_freq: 1500
      - alarm_duration: 300
      - alarm_delay: 300
  - module: QDU-Robomaster/CMD
    id: cmd
    args:
      - mode: CMD::Mode::CMD_OP_CTRL
      - chassis_cmd_topic_name: "chassis_cmd"
      - gimbal_cmd_topic_name: "gimbal_cmd"
      - launcher_cmd_topic_name: "launcher_cmd"
  - module: QDU-Robomaster/DR16
    id: dr16
    args:
      - uart: usart3
      - cmd: cmd
      - param:
          task_stack_depth_uart: 1536
          thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - module: QDU-Robomaster/VT13
    id: vt13
    args:
      - uart: usart6
      - cmd: cmd
      - param:
          task_stack_depth_uart: 1536
          thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - module: QDU-Robomaster/Referee
    id: ref
    args:
      - uart: usart1
      - cmd: nullptr
      - param:
          task_stack_depth_uart: 1536
          baudrate: 115200
          referee_chassis_tp_name: "chassis_ref"
          referee_launcher_tp_name: "launcher_ref"
          referee_robot_game_tp_name: "robot_game_ref"
          referee_radar_tp_name: "radar_ref"
          thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - module: xrobot-org/BMI088
    id: bmi088
    args:
      - accl_cs: ACCL_CS
      - gyro_cs: GYRO_CS
      - gyro_int: GYRO_INT
      - spi: spi1
      - heater_pwm: pwm_tim10_ch1
      - database: database
      - ramfs: ramfs
      - param:
          gyro_freq: BMI088::GyroFreq::GYRO_2000HZ_BW532HZ
          accl_freq: BMI088::AcclFreq::ACCL_1600HZ
          gyro_range: BMI088::GyroRange::DEG_2000DPS
          accl_range: BMI088::AcclRange::ACCL_24G
          # 安装方向四元数 (w, x, y, z) / mounting rotation quaternion (w, x, y, z)
          rotation: '{1.0, 0.0, 0.0, 0.0}'
          pid_param: '{.p = 0.35}'
          gyro_topic_name: "gimbal_gyro"
          accl_topic_name: "gimbal_accl"
          target_temperature: 45
          task_stack_depth: 2048
  - module: xrobot-org/MadgwickAHRS
    id: ahrs
    args:
      - ramfs: ramfs
      - param:
          beta: 0.05
          gyro_topic_name: "gimbal_gyro"
          accl_topic_name: "gimbal_accl"
          quaternion_topic_name: "gimbal_quat"
          euler_topic_name: "gimbal_euler"
          task_stack_depth: 2048
  - module: QDU-Robomaster/CameraSync
    id: camera_sync
    args:
      - camera_pin: CAMERA
      - param:
          camera_sync_topic_name: "camera_sync_result"
          imu_topic_name: "gimbal_gyro"
          trigger_period_us: 5000
          camera_sync_command_topic_name: "camera_sync_command"
  - module: QDU-Robomaster/RMMotor
    id: motor_wheel_0
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 515
  - module: QDU-Robomaster/RMMotor
    id: motor_wheel_1
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 516
  - module: QDU-Robomaster/RMMotor
    id: motor_wheel_2
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 513
  - module: QDU-Robomaster/RMMotor
    id: motor_wheel_3
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 514
  - module: QDU-Robomaster/RMMotor
    id: motor_pit
    args:
      - can_bus: can2
      - param:
          model: RMMotor::Model::MOTOR_GM6020
          reverse: true
          feedback_id: 517
  - module: QDU-Robomaster/DMMotor
    id: motor_yaw
    args:
      - can_bus: can2
      - param:
          model: DMMotor::Model::MOTOR_DM4310
          reverse: false
          can_id: 5
  - module: QDU-Robomaster/RMMotor
    id: motor_trig
    args:
      - can_bus: can2
      - param:
          model: RMMotor::Model::MOTOR_M2006
          reverse: false
          feedback_id: 513
  - module: QDU-Robomaster/RMMotor
    id: motor_fric_front_left
    args:
      - can_bus: can2
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: true
          feedback_id: 514
  - module: QDU-Robomaster/RMMotor
    id: motor_fric_front_right
    args:
      - can_bus: can2
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 515
  - module: QDU-Robomaster/SuperPower
    id: superpower
    args:
      - can_bus: can1
      - chassis_ref_topic_name: "chassis_ref"
  - module: QDU-Robomaster/PowerControl
    id: power_control
    args:
      - super_power: superpower
      - is_helm: false
      - chassis_static_power_loss: 4.5
      - motor_count_3508: 4
      - motor_count_6020: 0
  - module: QDU-Robomaster/Chassis
    id: chassis
    template_args:
      - Omni
    args:
      - motor_wheel_0: motor_wheel_0
      - motor_wheel_1: motor_wheel_1
      - motor_wheel_2: motor_wheel_2
      - motor_wheel_3: motor_wheel_3
      - motor_steer_0: nullptr
      - motor_steer_1: nullptr
      - motor_steer_2: nullptr
      - motor_steer_3: nullptr
      - cmd: cmd
      - power_control: power_control
      - referee: ref
      - task_stack_depth: 1536
      - param:
          chassis_param:
            wheel_radius: 0.065
            wheel_to_center: 0.26
            gravity_height: 0.2
            reduction_ratio: 15.7647
            wheel_resistance: 0.0
            error_compensation: 0.0
            gravity: 230
            length: 0.3
            width: 0.3
            rotor_speed_scale: 1.0
            rotor_omega_min_scale: 0.55
            rotor_buffer_low_j: 35.0
            rotor_buffer_high_j: 70.0
            rotor_scale_lpf_alpha: 0.3
          pid_follow: '{.p = 10.0, .cycle = true}'
          pid_velocity_x: '{.p = 300.0}'
          pid_velocity_y: '{.p = 300.0}'
          pid_omega: '{.p = 300.0}'
          pid_wheel_speed_0: '{.p = 0.05, .out_limit = 5.0}'
          pid_wheel_speed_1: '{.p = 0.05, .out_limit = 5.0}'
          pid_wheel_speed_2: '{.p = 0.05, .out_limit = 5.0}'
          pid_wheel_speed_3: '{.p = 0.05, .out_limit = 5.0}'
          pid_steer_angle_0: '{}'
          pid_steer_angle_1: '{}'
          pid_steer_angle_2: '{}'
          pid_steer_angle_3: '{}'
          pid_steer_speed_0: '{}'
          pid_steer_speed_1: '{}'
          pid_steer_speed_2: '{}'
          pid_steer_speed_3: '{}'
          thread_priority: LibXR::Thread::Priority::HIGH
          chassis_cmd_topic_name: "chassis_cmd"
          chassis_ref_topic_name: "chassis_ref"
          gimbal_euler_topic_name: "gimbal_euler"
  - module: QDU-Robomaster/Gimbal
    id: gimbal
    args:
      - cmd: cmd
      - motor_pit: motor_pit
      - motor_yaw: motor_yaw
      - referee: '&ref'
      - param:
          task_stack_depth: 1536
          pid_yaw_angle: '{.p = 14.0, .cycle = true}'
          pid_yaw_omega: '{.p = 4.8}'
          pid_pit_angle: '{.p = 13.5, .cycle = true}'
          pid_pit_omega: '{.p = 3.58, .d = 0.01}'
          pit_max_angle: 0.16
          pit_min_angle: 5.75
          pit_lc: 0.0
          pit_theta: 0.0
          yaw_k: 0.0
          j_pit: 0.005
          j_yaw: 0.03
          pit_zero: 5.75
          yaw_zero: 2.8879559
          patrol_range: 0.0
          patrol_omega: 0.0
          reverse_flag: true
          thread_priority: LibXR::Thread::Priority::HIGH
          euler_topic_name: "gimbal_euler"
          gyro_topic_name: "gimbal_gyro"
          gimbal_cmd_topic_name: "gimbal_cmd"
  - module: QDU-Robomaster/InfantryLauncher
    id: launcher
    args:
      - motor_fric_0: motor_fric_front_left
      - motor_fric_1: motor_fric_front_right
      - motor_trig: motor_trig
      - cmd: cmd
      - referee: '&ref'
      - param:
          task_stack_depth: 1536
          pid_param_trig_angle: '{.p = 40.0}'
          pid_param_trig_speed: '{.p = 0.15}'
          pid_param_fric_speed_0: '{.k = 0.8, .p = 0.0008, .out_limit = 0.6}'
          pid_param_fric_speed_1: '{.k = 0.8, .p = 0.0008, .out_limit = 0.6}'
          launcher_param:
            fric1_setpoint_speed: 5800.0
            target_bullet_speed: 21.0
            bullet_speed_tolerance: 1.0
            trig_gear_ratio: 36.0
            num_trig_tooth: 10
          thread_priority: LibXR::Thread::Priority::HIGH
          launcher_cmd_topic_name: "launcher_cmd"
          launcher_ref_topic_name: "launcher_ref"
  - module: QDU-Robomaster/EventBinder
    id: event_binder
    args:
      - modules: '{{"dr16", dr16}, {"vt13", vt13}, {"cmd", cmd}, {"chassis", chassis}, {"gimbal", gimbal}, {"launcher", launcher}}'
      - event_binding_groups: '{{{{"dr16", DR16::SwitchPos::DR16_SW_R_POS_MID, "cmd", CMD::Mode::CMD_OP_CTRL}, {"dr16", DR16::SwitchPos::DR16_SW_R_POS_BOT, "cmd", CMD::Mode::CMD_AUTO_CTRL}, {"dr16", DR16::Key::KEY_R_PRESS, "cmd", CMD::Mode::CMD_AUTO_CTRL}, {"dr16", DR16::Key::KEY_R_RELEASE, "cmd", CMD::Mode::CMD_OP_CTRL}, {"dr16", DR16::SwitchPos::DR16_SW_L_POS_TOP, "chassis", Omni::ChassisMode::RELAX}, {"dr16", DR16::SwitchPos::DR16_SW_L_POS_MID, "chassis", Omni::ChassisMode::FOLLOW}, {"dr16", DR16::SwitchPos::DR16_SW_L_POS_BOT, "chassis", Omni::ChassisMode::ROTOR}, {"dr16", DR16::Key::KEY_Q, "chassis", Omni::ChassisMode::FOLLOW}, {"dr16", DR16::Key::KEY_E, "chassis", Omni::ChassisMode::ROTOR}, {"dr16", DR16::SwitchPos::DR16_SW_L_POS_TOP, "gimbal", GimbalEvent::SET_MODE_RELAX}, {"dr16", DR16::SwitchPos::DR16_SW_L_POS_MID, "gimbal", GimbalEvent::SET_MODE_COMMON}, {"dr16", DR16::SwitchPos::DR16_SW_L_POS_TOP, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_RELAX}, {"dr16", DR16::SwitchPos::DR16_SW_R_POS_TOP, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE}, {"dr16", DR16::SwitchPos::DR16_SW_R_POS_MID, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE}, {"dr16", DR16::SwitchPos::DR16_SW_R_POS_BOT, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_ON, "cmd", CMD::Mode::CMD_AUTO_CTRL}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_OFF, "cmd", CMD::Mode::CMD_OP_CTRL}, {"vt13", VT13::Key::KEY_R_PRESS, "cmd", CMD::Mode::CMD_AUTO_CTRL}, {"vt13", VT13::Key::KEY_R_RELEASE, "cmd", CMD::Mode::CMD_OP_CTRL}, {"vt13", VT13::SwitchPos::VT13_SW_POS_C, "chassis", Omni::ChassisMode::RELAX}, {"vt13", VT13::SwitchPos::VT13_SW_POS_N, "chassis", Omni::ChassisMode::FOLLOW}, {"vt13", VT13::SwitchPos::VT13_SW_POS_S, "chassis", Omni::ChassisMode::ROTOR}, {"vt13", VT13::Key::KEY_Q, "chassis", Omni::ChassisMode::FOLLOW}, {"vt13", VT13::Key::KEY_E, "chassis", Omni::ChassisMode::ROTOR}, {"vt13", VT13::Key::KEY_Q, "gimbal", GimbalEvent::SET_MODE_COMMON}, {"vt13", VT13::Key::KEY_E, "gimbal", GimbalEvent::SET_MODE_COMMON}, {"vt13", VT13::SwitchPos::VT13_SW_POS_C, "gimbal", GimbalEvent::SET_MODE_RELAX}, {"vt13", VT13::SwitchPos::VT13_SW_POS_N, "gimbal", GimbalEvent::SET_MODE_COMMON}, {"vt13", VT13::SwitchPos::VT13_SW_POS_S, "gimbal", GimbalEvent::SET_MODE_COMMON}, {"vt13", VT13::SwitchPos::VT13_KEY_PAUSE_TOGGLE_ON, "gimbal", GimbalEvent::SET_MODE_COMMON}, {"vt13", VT13::SwitchPos::VT13_KEY_PAUSE_TOGGLE_OFF, "gimbal", GimbalEvent::SET_MODE_RELAX}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_ON, "gimbal", GimbalEvent::SET_MODE_COMMON}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_OFF, "gimbal", GimbalEvent::SET_MODE_COMMON}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_L_TOGGLE_OFF, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_L_TOGGLE_OFF, "launcher", InfantryLauncher::LauncherEvent::SET_SHOTMODE_SINGLE}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_L_TOGGLE_ON, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_L_TOGGLE_ON, "launcher", InfantryLauncher::LauncherEvent::SET_SHOTMODE_SINGLE}, {"vt13", VT13::Key::KEY_G, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE}, {"vt13", VT13::Key::KEY_C, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}, {"vt13", VT13::Key::KEY_C, "launcher", InfantryLauncher::LauncherEvent::SET_SHOTMODE_SINGLE}, {"vt13", VT13::Key::KEY_V, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}, {"vt13", VT13::Key::KEY_V, "launcher", InfantryLauncher::LauncherEvent::SET_SHOTMODE_BOOST_3}, {"vt13", VT13::Key::KEY_B, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}, {"vt13", VT13::Key::KEY_B, "launcher", InfantryLauncher::LauncherEvent::SET_SHOTMODE_CONTINUE}}}}'
  - module: QDU-Robomaster/HostData
    id: hostdata
    args:
      - cmd: cmd
      - host_gimbal_topic_name: "target_euler"
      - host_chassis_data_topic_name: "chassis_data"
      - host_fire_topic_name: "fire_notify"
  - module: xrobot-org/SharedTopic
    id: sharedtopic
    args:
      - uart: usb_otg_hs_cdc
      - ramfs: ramfs
      - uart_name: "usb_otg_hs_cdc"
      - buffer_size: 512
      - topic_configs: '{"target_euler", "fire_notify", "camera_sync_command"}'
  - module: xrobot-org/SharedTopicClient
    id: sharedtopicclient
    args:
      - uart: usb_otg_hs_cdc
      - slot_count: 16
      - topic_configs: '{"gimbal_gyro", "gimbal_accl", "gimbal_quat", "camera_sync_result", "robot_game_ref"}'
settings:
  monitor_sleep_ms: 1000
