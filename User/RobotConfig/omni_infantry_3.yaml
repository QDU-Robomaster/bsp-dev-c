    "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_ON,
    "cmd", CMD::Mode::CMD_AUTO_CTRL}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_OFF,
    "cmd", CMD::Mode::CMD_OP_CTRL}, {"vt13", VT13::Key::KEY_R_PRESS, "cmd", CMD::Mode::CMD_AUTO_CTRL},
    {"vt13", VT13::Key::KEY_R_RELEASE, "cmd", CMD::Mode::CMD_OP_CTRL}, {"vt13", VT13::SwitchPos::VT13_SW_POS_C,
    "chassis", Omni::ChassisMode::RELAX}, {"vt13", VT13::SwitchPos::VT13_SW_POS_N,
