- module: QDU-Robomaster/HostData
  id: hostdata
  args:
  - cmd
  - '"target_euler"'
  - '"chassis_data"'
  - '"fire_notify"'
- module: xrobot-org/SharedTopic
  id: sharedtopic
  args:
  - usb_otg_hs_cdc
  - ramfs
  - '"usb_otg_hs_cdc"'
  - '512'
  - '{"target_euler", "fire_notify", "camera_sync_command"}'
- module: xrobot-org/SharedTopicClient
  id: sharedtopicclient
  args:
  - usb_otg_hs_cdc
  - '16'
  - '{"gimbal_gyro", "gimbal_accl", "gimbal_quat", "camera_sync_result", "robot_game_ref"}'
settings:
  monitor_sleep_ms: 1000
