    cmd: '@&cmd'
- id: event_binder
  name: EventBinder
  constructor_args:
    modules:
    - name: dr16
      module_ref: '@dr16'
    - name: vt13
      module_ref: '@vt13'
    - name: cmd
      module_ref: '@cmd'
    - name: chassis
      module_ref: '@chassis'
    - name: gimbal
      module_ref: '@gimbal'
    - name: launcher
      module_ref: '@launcher'
    event_binding_groups:
    - bindings:
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_MID
        target_module: cmd
        target_event: CMD::Mode::CMD_OP_CTRL
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_BOT
        target_module: cmd
        target_event: CMD::Mode::CMD_AUTO_CTRL
      # 鼠标右键切换自瞄模式
      - source_module: dr16
        source_event: DR16::Key::KEY_R_PRESS
        target_module: cmd
        target_event: CMD::Mode::CMD_AUTO_CTRL
      - source_module: dr16
        source_event: DR16::Key::KEY_R_RELEASE
        target_module: cmd
        target_event: CMD::Mode::CMD_OP_CTRL
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_TOP
        target_module: chassis
        target_event: Omni::ChassisMode::RELAX
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_MID
        target_module: chassis
        target_event: Omni::ChassisMode::FOLLOW
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_BOT
        target_module: chassis
        target_event: Omni::ChassisMode::ROTOR
      # Q键切换FOLLOW模式，E键切换ROTOR模式
      - source_module: dr16
        source_event: DR16::Key::KEY_Q
        target_module: chassis
        target_event: Omni::ChassisMode::FOLLOW
      - source_module: dr16
        source_event: DR16::Key::KEY_E
        target_module: chassis
        target_event: Omni::ChassisMode::ROTOR
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_TOP
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_RELAX
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_MID
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_COMMON
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_TOP
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_RELAX
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_TOP
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_MID
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_BOT
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_READY
      - source_module: dr16
        source_event: DR16::Key::KEY_Z
        target_module: launcher
        target_event: InfantryLauncher::FireModeEvent::SET_FIREMODE_SINGLE
      - source_module: dr16
        source_event: DR16::Key::KEY_X
        target_module: launcher
        target_event: InfantryLauncher::FireModeEvent::SET_FIREMODE_CONTINUE
      - source_module: dr16
        source_event: DR16::Key::KEY_C
        target_module: launcher
        target_event: InfantryLauncher::FireModeEvent::SET_FIREMODE_BOOST

      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_ON
        target_module: cmd
        target_event: CMD::Mode::CMD_AUTO_CTRL
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_OFF
        target_module: cmd
        target_event: CMD::Mode::CMD_OP_CTRL
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_SW_POS_C
        target_module: chassis
        target_event: Omni::ChassisMode::RELAX
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_SW_POS_N
        target_module: chassis
        target_event: Omni::ChassisMode::FOLLOW
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_SW_POS_S
        target_module: chassis
        target_event: Omni::ChassisMode::ROTOR
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_SW_POS_C
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_RELAX
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_SW_POS_N
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_COMMON
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_SW_POS_S
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_COMMON
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_PAUSE_TOGGLE_ON
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_COMMON
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_PAUSE_TOGGLE_OFF
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_RELAX
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_ON
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_COMMON
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_OFF
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_COMMON
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_CUSTOM_L_TOGGLE_OFF
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_CUSTOM_L_TOGGLE_OFF
        target_module: launcher
        target_event: InfantryLauncher::FireModeEvent::SET_FIREMODE_CONTINUE
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_CUSTOM_L_TOGGLE_ON
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_READY
      - source_module: vt13
        source_event: VT13::SwitchPos::VT13_KEY_CUSTOM_L_TOGGLE_ON
        target_module: launcher
        target_event: InfantryLauncher::FireModeEvent::SET_FIREMODE_CONTINUE

- id: hostdata
  name: HostData
  constructor_args:
    cmd: '@cmd'
    target_euler_topic_name: target_euler
    chassis_data_topic_name: chassis_data
    fire_notify_topic_name: fire_notify
- id: sharedtopic
  name: SharedTopic
  constructor_args:
    uart_name: usb_otg_hs_cdc
    buffer_size: 256
    topic_configs:
    - target_euler
    - fire_notify
- id: sharedtopicclient
  name: SharedTopicClient
  constructor_args:
    uart_name: usb_otg_hs_cdc
    slot_count: 16
    topic_configs:
    - ahrs_quaternion
