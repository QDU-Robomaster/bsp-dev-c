# 轮腿步兵 (wheel-leg infantry) —— 由 User/xrobot_main.hpp 翻译而来
# Wheel-leg infantry, translated from the hand-written User/xrobot_main.hpp.
# 硬件名取自 User/app_main.cpp 的 XR_REGISTER 变量名。
# Hardware names are the XR_REGISTER variable names of User/app_main.cpp.
modules:
  - module: xrobot-org/BlinkLED
    id: blink_led
    args:
      - led: LED_B
      - blink_cycle: 250
  - module: xrobot-org/BuzzerAlarm
    id: buzzer_alarm
    args:
      - pwm: pwm_tim4_ch3
      - alarm_freq: 5000
      - alarm_duration: 300
      - alarm_delay: 300
  - module: xrobot-org/BMI088
    id: bmi088
    args:
      - accl_cs: ACCL_CS
      - gyro_cs: GYRO_CS
      - gyro_int: GYRO_INT
      - spi: spi1
      - heater_pwm: pwm_tim10_ch1
      - database: database
      - ramfs: ramfs
      - param:
          gyro_freq: BMI088::GyroFreq::GYRO_2000HZ_BW532HZ
          accl_freq: BMI088::AcclFreq::ACCL_1600HZ
          gyro_range: BMI088::GyroRange::DEG_2000DPS
          accl_range: BMI088::AcclRange::ACCL_24G
          rotation: '{0.0, 0.0, 0.0, 1.0}'
          pid_param: '{.k = 1.0, .p = 0.3, .i = 1.0, .d = 0.05, .i_limit = 0.0, .out_limit = 0.3, .cycle = false}'
          gyro_topic_name: "gimbal_gyro"
          accl_topic_name: "gimbal_accl"
          target_temperature: 45
          task_stack_depth: 1408
  - module: xrobot-org/MadgwickAHRS
    id: ahrs
    args:
      - ramfs: ramfs
      - param:
          beta: 0.05
          gyro_topic_name: "gimbal_gyro"
          accl_topic_name: "gimbal_accl"
          quaternion_topic_name: "gimbal_quat"
          euler_topic_name: "gimbal_euler"
          task_stack_depth: 1920
  - module: QDU-Robomaster/CMD
    id: cmd
    args:
      # 默认手动。DR16 右拨杆中位进入上位机控制（与 10.14 版本相同），上位与下位回到手动。
      # Manual by default. DR16 right switch MID selects host control (as in the 10.14
      # version); TOP and BOT return to manual.
      - mode: CMD::Mode::CMD_OP_CTRL
      - chassis_cmd_topic_name: "chassis_cmd"
      - gimbal_cmd_topic_name: "gimbal_cmd"
      - launcher_cmd_topic_name: "launcher_cmd"
  - module: QDU-Robomaster/DR16
    id: dr16
    args:
      - uart: usart3
      - cmd: cmd
      - param:
          task_stack_depth_uart: 1024
          thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - module: QDU-Robomaster/VT13
    id: vt13
    args:
      - uart: usart6
      - cmd: cmd
      - param:
          task_stack_depth_uart: 1280
          thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - module: QDU-Robomaster/Referee
    id: ref
    args:
      - uart: usart1
      - cmd: nullptr
      - param:
          task_stack_depth_uart: 1024
          baudrate: 115200
          referee_chassis_tp_name: "chassis_ref"
          referee_launcher_tp_name: "launcher_ref"
          # 自瞄上位机按 robot_game_ref 订阅（原为 sentry_ref，固件内无其他订阅者）
          # The auto-aim host subscribes robot_game_ref (was sentry_ref; nothing else in the
          # firmware subscribes it).
          referee_robot_game_tp_name: "robot_game_ref"
          referee_radar_tp_name: "radar_ref"
          thread_priority_uart: LibXR::Thread::Priority::MEDIUM
  - module: QDU-Robomaster/RMMotor
    id: motor_pit
    args:
      - can_bus: can2
      - param:
          model: RMMotor::Model::MOTOR_GM6020
          reverse: false
          feedback_id: 523
  - module: QDU-Robomaster/DMMotor
    id: motor_yaw
    args:
      - can_bus: can2
      - param:
          model: DMMotor::Model::MOTOR_DM4310
          reverse: false
          can_id: 6
  - module: QDU-Robomaster/RMMotor
    id: motor_fric_0
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: true
          feedback_id: 515
  - module: QDU-Robomaster/RMMotor
    id: motor_fric_1
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 514
  - module: QDU-Robomaster/RMMotor
    id: motor_trig
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M2006
          reverse: false
          feedback_id: 513
  - module: QDU-Robomaster/RMMotor
    id: wheel_left
    args:
      - can_bus: can2
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 516
  - module: QDU-Robomaster/RMMotor
    id: wheel_right
    args:
      - can_bus: can1
      - param:
          model: RMMotor::Model::MOTOR_M3508
          reverse: false
          feedback_id: 517
  - module: QDU-Robomaster/SuperPower
    id: superpower
    args:
      - can_bus: can1
      - chassis_ref_topic_name: "chassis_ref"
  - module: QDU-Robomaster/AtomImuCan
    id: atomimu
    args:
      - can_bus: can2
      - param:
          can_id: 10
  - module: QDU-Robomaster/InfantryLauncher
    id: launcher
    args:
      - motor_fric_0: motor_fric_0
      - motor_fric_1: motor_fric_1
      - motor_trig: motor_trig
      - cmd: cmd
      - referee: '&ref'
      - param:
          task_stack_depth: 1344
          pid_param_trig_angle: '{.k = 1.0, .p = 48.0, .i = 0.1}'
          pid_param_trig_speed: '{.k = 1.0, .p = 0.55}'
          pid_param_fric_speed_0: '{.k = 0.8, .p = 0.0008, .out_limit = 0.6}'
          pid_param_fric_speed_1: '{.k = 0.8, .p = 0.0008, .out_limit = 0.6}'
          launcher_param:
            fric1_setpoint_speed: 6000.0
            target_bullet_speed: 25.0
            bullet_speed_tolerance: 1.5
            trig_gear_ratio: 36.0
            num_trig_tooth: 10
          thread_priority: LibXR::Thread::Priority::HIGH
          launcher_cmd_topic_name: "launcher_cmd"
          launcher_ref_topic_name: "launcher_ref"
  - module: QDU-Robomaster/Wheelleg
    id: wheelleg
    args:
      - cmd: cmd
      - referee: ref
      - superpower: superpower
      - hip_leftfront_can: can2
      - hip_leftback_can: can2
      - hip_rightfront_can: can1
      - hip_rightback_can: can1
      - wheel_left: wheel_left
      - wheel_right: wheel_right
      - param:
          task_stack_depth: 4072
          vmc_left_param:
            leg_4: 0.21
            leg_1: 0.21
            leg_3: 0.25
            leg_2: 0.25
            hip_length: 0.0
          vmc_right_param:
            leg_4: 0.21
            leg_1: 0.21
            leg_3: 0.25
            leg_2: 0.25
            hip_length: 0.0
          pid_leglength_left_param: '{.k = 1.0, .p = 900.0, .i = 10.0, .d = 50.0, .i_limit = 10.0, .out_limit = 280.0}'
          pid_leglength_right_param: '{.k = 1.0, .p = 900.0, .i = 10.0, .d = 50.0, .i_limit = 10.0, .out_limit = 280.0}'
          pid_theta_left_param: '{.k = 1.0, .p = 15.0, .i_limit = 1.0, .out_limit = 5.0, .cycle = true}'
          pid_theta_right_param: '{.k = 1.0, .p = 15.0, .i_limit = 1.0, .out_limit = 5.0, .cycle = true}'
          pid_roll_param: '{.k = 1.0, .p = 1000.0, .i = 250.0, .d = 50.0, .out_limit = 250.0}'
          hip_leftfront_param:
            model: DMMotor::Model::MOTOR_DM8009
            reverse: true
            can_id: 1
          hip_leftback_param:
            model: DMMotor::Model::MOTOR_DM8009
            reverse: true
            can_id: 2
          hip_rightfront_param:
            model: DMMotor::Model::MOTOR_DM8009
            reverse: true
            can_id: 4
          hip_rightback_param:
            model: DMMotor::Model::MOTOR_DM8009
            reverse: true
            can_id: 3
          robot_param:
            mech_zero: [0.0, 0.0, 0.0, 0.0]
            static_l0: [0.16, 0.16]
            static_f0: [120.0, 120.0]
            wheel_radius: 0.06
            max_speed: 2.8
            k_poly_coefficient: [[-0.17168, -8.0007, 3.1409, 10.36, -0.27467, -3.6032], [-0.6403, -24.861, 10.13, 32.079, -1.662, -11.658], [-3.1652, 10.652, -5.9968, -6.3844, 2.7833, 7.8984], [-0.86611, 3.1655, -2.066, -1.076, 0.63982, 2.6728], [-2.6525, -69.994, 14.358, 46.375, 16.797, -23.451], [-0.10377, -4.5698, 0.9052, -3.8216, 3.2836, -1.978], [-0.82721, -4.345, -26.191, 21.701, -0.35408, 34.448], [0.071323, -1.4322, -1.2829, 3.9381, -6.7078, 1.7732], [-20.567, 4.2555, 36.352, 50.084, -41.966, -28.879], [-2.348, -0.040352, 5.8797, 6.0777, -5.683, -5.8926], [-0.17168, 3.1409, -8.0007, -3.6032, -0.27467, 10.36], [-0.6403, 10.13, -24.861, -11.658, -1.662, 32.079], [3.1652, 5.9968, -10.652, -7.8984, -2.7833, 6.3844], [0.86611, 2.066, -3.1655, -2.6728, -0.63982, 1.076], [-0.82721, -26.191, -4.345, 34.448, -0.35408, 21.701], [0.071323, -1.2829, -1.4322, 1.7732, -6.7078, 3.9381], [-2.6525, 14.358, -69.994, -23.451, 16.797, 46.375], [-0.10377, 0.9052, -4.5698, -1.978, 3.2836, -3.8216], [-20.567, 36.352, 4.2555, -28.879, -41.966, 50.084], [-2.348, 5.8797, -0.040352, -5.8926, -5.683, 6.0777], [5.9805, 7.667, -18.668, -42.577, 25.218, 21.455], [19.2, 23.262, -60.936, -133.43, 84.57, 69.317], [-3.1618, -40.537, -5.7538, 73.699, -36.123, 12.745], [-0.77636, -13.919, -0.97592, 24.018, -13.295, 2.8213], [39.981, 108.5, -24.215, -277.51, 111.08, 17.262], [2.611, 13.454, -4.6075, -20.451, 4.1017, 6.4613], [7.0928, -42.954, -19.587, 36.325, -125.9, 71.528], [0.07784, 3.568, 5.6839, -13.755, -5.3652, -0.089005], [-4.7662, -366.97, 18.505, 354.97, 165.9, -39.095], [1.4885, -30.101, -4.0553, 18.923, 25.628, 3.371], [5.9805, -18.668, 7.667, 21.455, 25.218, -42.577], [19.2, -60.936, 23.262, 69.317, 84.57, -133.43], [3.1618, 5.7538, 40.537, -12.745, 36.123, -73.699], [0.77636, 0.97592, 13.919, -2.8213, 13.295, -24.018], [7.0928, -19.587, -42.954, 71.528, -125.9, 36.325], [0.07784, 5.6839, 3.568, -0.089005, -5.3652, -13.755], [39.981, -24.215, 108.5, 17.262, 111.08, -277.51], [2.611, -4.6075, 13.454, 6.4613, 4.1017, -20.451], [-4.7662, 18.505, -366.97, -39.095, 165.9, 354.97], [1.4885, -4.0553, -30.101, 3.371, 25.628, 18.923]]
          chassis_cmd_topic_name: "chassis_cmd"
  - module: QDU-Robomaster/Gimbal
    id: gimbal
    args:
      - cmd: cmd
      - motor_pit: motor_pit
      - motor_yaw: motor_yaw
      - referee: '&ref'
      - param:
          task_stack_depth: 1536
          pid_yaw_angle: '{.k = 1.0, .p = 60.0, .d = 0.0005, .i_limit = 50.0, .cycle = true}'
          pid_yaw_omega: '{.k = 1.0, .p = 2.5, .out_limit = 8.0}'
          pid_pit_angle: '{.k = 1.0, .p = 100.0, .i = 5.0}'
          pid_pit_omega: '{.k = 1.0, .p = 0.27}'
          pit_max_angle: 4.7
          pit_min_angle: 3.7
          pit_lc: 1.4
          pit_theta: -0.08
          yaw_k: 0.0
          j_pit: 0.015
          j_yaw: 0.025
          pit_zero: 0.0
          yaw_zero: -3.00310063
          patrol_range: 0.0
          patrol_omega: 0.0
          reverse_flag: true
          thread_priority: LibXR::Thread::Priority::HIGH
          euler_topic_name: "gimbal_euler"
          gyro_topic_name: "gimbal_gyro"
          gimbal_cmd_topic_name: "gimbal_cmd"
  - module: QDU-Robomaster/HostData
    id: hostdata
    args:
      - cmd: cmd
      - host_gimbal_topic_name: "target_euler"
      - host_chassis_data_topic_name: "chassis_data"
      - host_fire_topic_name: "fire_notify"
  - module: QDU-Robomaster/CameraSync
    id: camera_sync
    args:
      - camera_pin: CAMERA
      - param:
          camera_sync_topic_name: "camera_sync_result"
          imu_topic_name: "gimbal_gyro"
          trigger_period_us: 20000
          camera_sync_command_topic_name: "camera_sync_command"
  - module: xrobot-org/SharedTopic
    id: sharedtopic
    args:
      - uart: usb_otg_hs_cdc
      - ramfs: ramfs
      - uart_name: "usb_otg_hs_cdc"
      - buffer_size: 256
      - topic_configs: '{"fire_notify", "target_euler", "chassis_data", "camera_sync_command"}'
  - module: xrobot-org/SharedTopicClient
    id: sharedtopicclient
    args:
      - uart: usb_otg_hs_cdc
      - slot_count: 40
      - topic_configs: '{"gimbal_gyro", "gimbal_accl", "gimbal_quat", "camera_sync_result", "robot_game_ref"}'
  - module: QDU-Robomaster/EventBinder
    id: event_binder
    args:
      - modules: '{{"cmd", cmd}, {"dr16", dr16}, {"wheelleg", wheelleg}, {"launcher", launcher}}'
      # 原 LaunchEvent 词表 (FricEvent) 在 1.0 模块里改名为 LauncherEvent，语义不变。
      # The old FricEvent vocabulary is LauncherEvent in the 1.0 Module; same meaning.
      # 第一组：DR16 右拨杆中位 -> 上位机控制，上位与下位 -> 手动。
      # First group: DR16 right switch MID -> host control, TOP and BOT -> manual.
      - event_binding_groups: '{{{{"dr16", DR16::SwitchPos::DR16_SW_R_POS_TOP, "cmd", CMD::Mode::CMD_OP_CTRL}, {"dr16", DR16::SwitchPos::DR16_SW_R_POS_MID, "cmd", CMD::Mode::CMD_AUTO_CTRL}, {"dr16", DR16::SwitchPos::DR16_SW_R_POS_BOT, "cmd", CMD::Mode::CMD_OP_CTRL}}}, {{{"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_OFF, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE}, {"vt13", VT13::SwitchPos::VT13_KEY_CUSTOM_R_TOGGLE_ON, "launcher", InfantryLauncher::LauncherEvent::SET_FRICMODE_READY}}}, {{{"dr16", DR16::SwitchPos::DR16_SW_L_POS_TOP, "wheelleg", Wheelleg::WheellegEvent::SET_MODE_RELAX}, {"dr16", DR16::SwitchPos::DR16_SW_L_POS_MID, "wheelleg", Wheelleg::WheellegEvent::SET_MODE_RESET}, {"dr16", DR16::SwitchPos::DR16_SW_L_POS_BOT, "wheelleg", Wheelleg::WheellegEvent::SET_MODE_ROTOR}, {"dr16", DR16::Key::KEY_R, "wheelleg", Wheelleg::WheellegEvent::SET_MODE_RESET}, {"dr16", DR16::Key::KEY_E, "wheelleg", Wheelleg::WheellegEvent::SET_MODE_STAND}, {"dr16", DR16::Key::KEY_Q, "wheelleg", Wheelleg::WheellegEvent::SET_MODE_ROTOR}}}}'
settings:
  monitor_sleep_ms: 1000
