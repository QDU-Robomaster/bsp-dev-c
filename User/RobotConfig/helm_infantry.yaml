- id: motor_wheel_3
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_M3508
      reverse: false
      feedback_id: 0x201
      can_bus_name: can2
- id: motor_steer_0
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: false
      feedback_id: 0x208
      can_bus_name: can1
- id: motor_steer_1
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: false
      feedback_id: 0x207
      can_bus_name: can1
- id: motor_steer_2
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: false
      feedback_id: 0x206
      can_bus_name: can1

- id: motor_steer_3
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: false
      feedback_id: 0x205
      can_bus_name: can1
- id: motor_yaw
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: true
      feedback_id: 0x20A
      can_bus_name: can1
- id: motor_pit
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: false
      feedback_id: 0x209
      can_bus_name: can1
- id: chassis
  name: Chassis
  constructor_args:
    motor_wheel_0: '@&motor_wheel_0'
    motor_wheel_1: '@&motor_wheel_1'
    motor_wheel_2: '@&motor_wheel_2'
    motor_wheel_3: '@&motor_wheel_3'
    motor_steer_0: '@&motor_steer_0'
    motor_steer_1: '@&motor_steer_1'
    motor_steer_2: '@&motor_steer_2'
    motor_steer_3: '@&motor_steer_3'
    cmd: '@&cmd'
    power_control: '@&power_control'
    task_stack_depth: 4096
    ChassisParam:
      wheel_radius: 0.063
      wheel_to_center: 0.31
      gravity_height: 0.0
      reductionratio: 19.2
      wheel_resistance: 0.0
      error_compensation: 0.0
    pid_follow_:
      k: 0.15
      p: 5.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: true
    pid_velocity_x_:
      k: 0.0015
      p: 14.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_velocity_y_:
      k: 0.0015
      p: 14.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_omega_:
      k: 0.0015
      p: 14.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_wheel_angle_0_:
      k: 0.0001
      p: 5
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_wheel_angle_1_:
      k: 0.0001
      p: 5
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_wheel_angle_2_:
      k: 0.0001
      p: 5
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_wheel_angle_3_:
      k: 0.0001
      p: 5
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_steer_angle_0_:
      k: 1.0
      p: 15.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: true
    pid_steer_angle_1_:
      k: 1.0
      p: 15.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: true
    pid_steer_angle_2_:
      k: 1.0
      p: 15.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: true
    pid_steer_angle_3_:
      k: 1.0
      p: 15.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: true
    pid_steer_speed_0_:
      k: 1
      p: 0.07
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_steer_speed_1_:
      k: 1
      p: 0.07
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_steer_speed_2_:
      k: 1
      p: 0.07
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_steer_speed_3_:
      k: 1
      p: 0.07
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
  template_args:
    ChassisType: Helm
- id: Gimbal_0
  name: Gimbal
  constructor_args:
    cmd: '@cmd'
    task_stack_depth: 4096
    pid_yaw_angle_param:
      k: 1.0
      p: 10.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: true
    pid_pitch_angle_param:
      k: 1.0
      p: 0.5
      i: 0.0
      d: 0.0001
      i_limit: 0.0
      out_limit: 50.0
      cycle: true
    pid_yaw_omega_param:
      k: 1.0
      p: 1.5
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_pitch_omega_param:
      k: 1.0
      p: 0.5
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 3.0
      cycle: false
    motor_pitch: '@&motor_pit'
    motor_yaw: '@&motor_yaw'
    limit:
      max_pitch_angle_: 0.0
      min_pitch_angle_: 0.0
      max_yaw_angle_: 0.0
      min_yaw_angle_: 0.0
      reverse_pitch_limit_: false
      reverse_yaw_limit_: false
      J_pit_: 0.0
      J_yaw_: 0.0
- id: dr16
  name: DR16
  constructor_args:
    CMD: '@cmd'
    task_stack_depth_uart: 1024
- id: event_binder
  name: EventBinder
  constructor_args:
    modules:
    - name: dr16
      module_ref: '@dr16'
    - name: cmd
      module_ref: '@cmd'
    - name: chassis
      module_ref: '@chassis'
    - name: gimbal
      module_ref: '@Gimbal_0'
    event_binding_groups:
    - bindings:
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_MID
        target_module: cmd
        target_event: CMD::Mode::CMD_OP_CTRL
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_BOT
        target_module: cmd
        target_event: CMD::Mode::CMD_AUTO_CTRL
    - bindings:
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_TOP
        target_module: chassis
        target_event: Helm::ChassisMode::RELAX
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_MID
        target_module: chassis
        target_event: Helm::ChassisMode::INDEPENDENT
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_BOT
        target_module: chassis
        target_event: Helm::ChassisMode::FOLLOW
    - bindings:
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_TOP
        target_module: gimbal
        target_event: GimbalMode::RELAX
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_MID
        target_module: gimbal
        target_event: GimbalMode::INDEPENDENT
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_BOT
        target_module: gimbal
        target_event: GimbalMode::AUTOAIM
- id: MadgwickAHRS_0
  name: MadgwickAHRS
  constructor_args:
    beta: 0.05
    gyro_topic_name: bmi088_gyro
    accl_topic_name: bmi088_accl
    quaternion_topic_name: ahrs_quaternion
    euler_topic_name: ahrs_euler
    task_stack_depth: 2048
- id: bmi088_0
  name: BMI088
  constructor_args:
    gyro_freq: BMI088::GyroFreq::GYRO_2000HZ_BW532HZ
    accl_freq: BMI088::AcclFreq::ACCL_1600HZ
    gyro_range: BMI088::GyroRange::DEG_2000DPS
    accl_range: BMI088::AcclRange::ACCL_24G
    rotation:
      w: 0.0
      x: 0.0
      y: 0.0
      z: 1.0
    pid_param:
      k: 1.0
      p: 0.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    gyro_topic_name: bmi088_gyro
    accl_topic_name: bmi088_accl
    target_temperature: 45
    task_stack_depth: 2048
    camera_sync_pin_name: CAMERA
    camera_sync_div: 10
- id: hostdata
  name: HostData
  constructor_args:
    cmd: '@cmd'
    target_euler_topic_name: target_euler
    chassis_data_topic_name: chassis_data
    fire_notify_topic_name: fire_notify
- id: sharedtopic
  name: SharedTopic
  constructor_args:
    interface_name: usb_otg_hs_cdc
    task_stack_depth: 2048
    tx_buffer_size: 256
    topic_names:
    - target_euler
    - chassis_data
    - fire_notify
- id: sharedtopicclient
  name: SharedTopicClient
  constructor_args:
    interface_name: usb_otg_hs_cdc
    task_stack_depth: 2048
    rx_buffer_size: 256
    topic_names:
    - ahrs_quaternion
    - chassis_yaw
