global_settings:
  monitor_sleep_ms: 1000
modules:
- id: blink_led
  name: BlinkLED
  constructor_args:
    blink_cycle: 250
- id: buzzer_alarm
  name: BuzzerAlarm
  constructor_args:
    alarm_freq: 1500
    alarm_duration: 300
    alarm_delay: 300
- id: cmd
  name: CMD
  constructor_args:
    mode: CMD::Mode::CMD_OP_CTRL
    chassis_cmd_topic_name: chassis_cmd
    gimbal_cmd_topic_name: gimbal_cmd
    launcher_cmd_topic_name: launcher_cmd
- id: dr16
  name: DR16
  constructor_args:
    CMD: '@cmd'
    task_stack_depth_uart: 1536
    thread_priority_uart: LibXR::Thread::Priority::HIGH
- id: vt13
  name: VT13
  constructor_args:
    CMD: '@cmd'
    task_stack_depth_uart: 1536
    thread_priority_uart: LibXR::Thread::Priority::HIGH
- id: ref
  name: Referee
  constructor_args:
    task_stack_depth_uart: 1536
    uart: uart_referee
    baudrate: 115200
    referee_chassis_tp_name: chassis_ref
    referee_launcher_tp_name: launcher_ref
    referee_robot_game_tp_name: robot_game_ref
    thread_priority_uart: LibXR::Thread::Priority::LOW
- id: bmi088
  name: BMI088
  constructor_args:
    gyro_freq: BMI088::GyroFreq::GYRO_1000HZ_BW116HZ
    accl_freq: BMI088::AcclFreq::ACCL_50HZ
    gyro_range: BMI088::GyroRange::DEG_2000DPS
    accl_range: BMI088::AcclRange::ACCL_24G
    rotation:
      w: 0.0
      x: 0.707106781187
      y: 0.707106781187
      z: 0.0
    pid_param:
      k: 1.0
      p: 0.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    gyro_topic_name: gimbal_gyro
    accl_topic_name: bmi088_accl
    target_temperature: 45
    task_stack_depth: 2048
- id: ahrs
  name: MadgwickAHRS
  constructor_args:
    beta: 0.05
    gyro_topic_name: gimbal_gyro
    accl_topic_name: bmi088_accl
    quaternion_topic_name: ahrs_quaternion
    euler_topic_name: gimbal_euler
    task_stack_depth: 2048
- id: motor_pit
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: false
      feedback_id: 520
      can_bus_name: can1
- id: motor_yaw
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_GM6020
      reverse: true
      feedback_id: 522
      can_bus_name: can1
- id: motor_trig
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_M2006
      reverse: false
      feedback_id: 514
      can_bus_name: can1
- id: motor_fric_0
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_M3508
      reverse: true
      feedback_id: 513
      can_bus_name: can1
- id: motor_fric_1
  name: RMMotor
  constructor_args:
    param:
      model: RMMotor::Model::MOTOR_M3508
      reverse: false
      feedback_id: 515
      can_bus_name: can1
- id: gimbal
  name: Gimbal
  constructor_args:
    cmd: '@cmd'
    task_stack_depth: 1536
    pid_yaw_angle:
      k: 1.0
      p: 20.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 80.0
      cycle: true
    pid_yaw_omega:
      k: 1.0
      p: 2.5
      i: 0.0
      d: 0.0
      i_limit: 0
      out_limit: 0
      cycle: false
    pid_pit_angle:
      k: 1.0
      p: 30.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: true
    pid_pit_omega:
      k: 1.0
      p: 1.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    motor_pitch: '@&motor_pit'
    motor_yaw: '@&motor_yaw'
    referee: '@ref'
    pit_max_angle: 1.82
    pit_min_angle: 0.92
    yaw_max_angle: 4.8
    yaw_min_angle: 1.0
    pit_lc: 0.0
    pit_theta: 0.0
    yaw_k: 0.0
    j_pit: 0.0218
    j_yaw: 0.0218
    pit_zero: 5.829
    yaw_zero: 6.0265288
    patrol_range: 0.0
    patrol_omega: 0.0
    pit_reverse_flag: true
    thread_priority: LibXR::Thread::Priority::HIGH
- id: launcher
  name: Launcher
  constructor_args:
    motor_fric_front_left: '@&motor_fric_0'
    motor_fric_front_right: '@&motor_fric_1'
    motor_fric_back_left: '@nullptr'
    motor_fric_back_right: '@nullptr'
    motor_trig: '@&motor_trig'
    task_stack_depth: 1536
    pid_trig_angle:
      k: 1.0
      p: 35.0
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 0.0
      cycle: false
    pid_trig_speed:
      k: 1.0
      p: 0.65
      i: 0.8
      d: 0.0
      i_limit: 0.0
      out_limit: 0.5
      cycle: false
    pid_fric_speed_0:
      k: 1.0
      p: 0.002
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 1.0
      cycle: false
    pid_fric_speed_1:
      k: 0.8
      p: 0.002
      i: 0.0
      d: 0.0
      i_limit: 0.0
      out_limit: 1.0
      cycle: false
    launcher_param:
      fric1_setpoint_speed: 6500.0
      fric2_setpoint_speed: 0.0
      trig_gear_ratio: 36.0
      num_trig_tooth: 10
      expect_trig_freq_: 15.0
      target_bullet_speed: 25.0
      bullet_speed_tolerance: 1.5
    cmd: '@&cmd'
- id: event_binder
  name: EventBinder
  constructor_args:
    modules:
    - name: dr16
      module_ref: '@dr16'
    - name: cmd
      module_ref: '@cmd'
    - name: gimbal
      module_ref: '@gimbal'
    - name: launcher
      module_ref: '@launcher'
    event_binding_groups:
    - bindings:
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_MID
        target_module: cmd
        target_event: CMD::Mode::CMD_OP_CTRL
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_BOT
        target_module: cmd
        target_event: CMD::Mode::CMD_AUTO_CTRL
      # 鼠标右键切换自瞄模式
      - source_module: dr16
        source_event: DR16::Key::KEY_R_PRESS
        target_module: cmd
        target_event: CMD::Mode::CMD_AUTO_CTRL
      - source_module: dr16
        source_event: DR16::Key::KEY_R_RELEASE
        target_module: cmd
        target_event: CMD::Mode::CMD_OP_CTRL
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_TOP
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_RELAX
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_MID
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_COMMON
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_R_POS_BOT
        target_module: gimbal
        target_event: GimbalEvent::SET_MODE_COMMON
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_TOP
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_SAFE
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_MID
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_READY
      - source_module: dr16
        source_event: DR16::SwitchPos::DR16_SW_L_POS_BOT
        target_module: launcher
        target_event: InfantryLauncher::LauncherEvent::SET_FRICMODE_READY
- id: hostdata
  name: HostData
  constructor_args:
    cmd: '@cmd'
    target_euler_topic_name: target_euler
    chassis_data_topic_name: chassis_data
    fire_notify_topic_name: fire_notify
- id: sharedtopic
  name: SharedTopic
  constructor_args:
    uart_name: usb_otg_hs_cdc
    buffer_size: 512
    topic_configs:
    - fire_notify
    - target_euler
- id: sharedtopicclient
  name: SharedTopicClient
  constructor_args:
    uart_name: usb_otg_hs_cdc
    slot_count: 8
    topic_configs:
    - ahrs_quaternion
