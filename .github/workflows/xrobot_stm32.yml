name: build

on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
    branches: [main, master, dev]
  schedule:
    - cron: '0 10 * * *'
  release:
    types: [published]
  workflow_dispatch:

env:
  XR_CONTEXT_REF: ${{ github.ref_type == 'tag' && format('refs/tags/{0}', github.ref_name) || format('refs/heads/{0}', github.head_ref || github.ref_name) }}
  # The line this build targets: the PR base branch, or the pushed branch/tag.
  XR_RELEASE_REF: ${{ github.base_ref && format('refs/heads/{0}', github.base_ref) || (github.ref_type == 'tag' && format('refs/tags/{0}', github.ref_name) || format('refs/heads/{0}', github.ref_name)) }}

jobs:
  build:
    name: build (${{ matrix.robot_config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        robot_config:
          - default
          - aerial
          - dart
          - helm_infantry
          - hero
          - omni_infantry_3
          - omni_infantry_4
          - radar
          - sentry
          - wheel_leg
    container:
      image: ghcr.io/xrobot-org/docker-image-stm32:main
      options: --user 0
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Init submodules
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git submodule update --init --recursive
    - name: Install pinned XRobot tools
      shell: bash
      run: |
        set -euo pipefail
        pin() { python3 -c 'import sys, yaml; print((yaml.safe_load(open(sys.argv[1])) or {}).get(sys.argv[2]) or "")' "$1" "$2"; }
        spec() { if [[ "$3" =~ ^[0-9a-f]{40}$ ]]; then echo "git+$2@$3"; else echo "$1==$3"; fi; }
        xrobot_pin=$(pin Modules/modules.yaml xrobot)
        generator_pin=$(pin User/libxr_config.yaml generator)
        if [[ -z "$xrobot_pin" || -z "$generator_pin" ]]; then
          echo "::error::Pin xrobot in Modules/modules.yaml and generator in User/libxr_config.yaml"
          exit 1
        fi
        python3 -m pip install \
          "$(spec xrobot https://github.com/xrobot-org/XRobot.git "$xrobot_pin")" \
          "$(spec libxr https://github.com/xrobot-org/LibXR_CppCodeGenerator.git "$generator_pin")"
    - name: Regenerate BSP objects
      run: |
        mkdir -p .ci-tools
        libxr parse -d . -o .ci-tools/cubemx.yaml
        libxr gen -i .ci-tools/cubemx.yaml -o User/app_main.cpp --xrobot --libxr-config User/libxr_config.yaml
    - name: Check generated BSP objects are committed
      shell: bash
      run: |
        set -euo pipefail
        generated=(User/app_main.cpp User/app_main.h User/flash_map.hpp User/libxr_config.yaml)
        if [[ -n "$(git status --porcelain -- "${generated[@]}")" ]]; then
          git --no-pager diff -- "${generated[@]}"
          echo "::error::Generated BSP objects differ from the commit; regenerate and commit them"
          exit 1
        fi
    - name: Check config layout
      run: xrobot format --check
    - name: Resolve locked Modules and check every config
      run: xrobot setup --frozen --context-ref "$XR_CONTEXT_REF" --release-ref "$XR_RELEASE_REF"
    - name: Configure
      run: |
        export GCC_TOOLCHAIN_ROOT=/opt/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin
        export CLANG_GCC_CMSIS_COMPILER=/opt/st-arm-clang
        cmake . -DCMAKE_TOOLCHAIN_FILE:STRING=cmake/starm-clang.cmake -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -Bbuild -G Ninja
    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ matrix.robot_config }}" != default ]]; then
          xrobot gen -c User/RobotConfig/${{ matrix.robot_config }}.yaml
        fi
        cmake --build build
    - name: Package firmware
      if: matrix.robot_config != 'default'
      run: |
        mkdir -p dist/${{ matrix.robot_config }}
        cp build/DevC.elf dist/${{ matrix.robot_config }}/${{ matrix.robot_config }}.elf
        cp build/DevC.hex dist/${{ matrix.robot_config }}/${{ matrix.robot_config }}.hex
        cp build/DevC.bin dist/${{ matrix.robot_config }}/${{ matrix.robot_config }}.bin
        cp User/RobotConfig/${{ matrix.robot_config }}.yaml dist/${{ matrix.robot_config }}/
        tar -C dist -czf dist/${{ matrix.robot_config }}-firmware.tar.gz ${{ matrix.robot_config }}
    - name: Upload firmware artifact
      if: matrix.robot_config != 'default'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.robot_config }}-firmware
        path: |
          dist/${{ matrix.robot_config }}/${{ matrix.robot_config }}.elf
          dist/${{ matrix.robot_config }}/${{ matrix.robot_config }}.hex
          dist/${{ matrix.robot_config }}/${{ matrix.robot_config }}.bin
          dist/${{ matrix.robot_config }}/${{ matrix.robot_config }}.yaml
          dist/${{ matrix.robot_config }}-firmware.tar.gz
        if-no-files-found: error

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        robot_config:
          - aerial
          - dart
          - helm_infantry
          - hero
          - omni_infantry_3
          - omni_infantry_4
          - radar
          - sentry
          - wheel_leg
    steps:
    - name: Download firmware artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.robot_config }}-firmware
        path: release-artifacts/${{ matrix.robot_config }}
    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-artifacts/${{ matrix.robot_config }}/${{ matrix.robot_config }}/${{ matrix.robot_config }}.elf
          release-artifacts/${{ matrix.robot_config }}/${{ matrix.robot_config }}/${{ matrix.robot_config }}.hex
          release-artifacts/${{ matrix.robot_config }}/${{ matrix.robot_config }}/${{ matrix.robot_config }}.bin
          release-artifacts/${{ matrix.robot_config }}/${{ matrix.robot_config }}/${{ matrix.robot_config }}.yaml
          release-artifacts/${{ matrix.robot_config }}/${{ matrix.robot_config }}-firmware.tar.gz
        fail_on_unmatched_files: true
