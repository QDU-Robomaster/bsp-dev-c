name: build

on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  build:
    # The release job of the shared workflow attaches firmware to releases, which needs write access.
    permissions:
      contents: write
    uses: xrobot-org/XRobot/.github/workflows/bsp-stm32-ci.yml@v1
    with:
      project: DevC
      configs: |
        default
        aerial
        dart
        helm_infantry
        hero
        omni_infantry_3
        omni_infantry_4
        radar
        sentry
        wheel_leg
